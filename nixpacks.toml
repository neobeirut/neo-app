[providers]
providers = ["node"]

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
HOST = "0.0.0.0"
PORT = "8080"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["export PUPPETEER_SKIP_DOWNLOAD=true && cd web && npm install"]

[phases.build]
cmds = ["cd web && npm run build"]

[start]
cmd = "cd web && npm run start"
