<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ovrload Admin</title>
    <script>
      if (window.location.hostname.includes('neobeirut.com')) {
        var subPath = window.location.pathname.replace(/^\/admin\/?/, '');
        window.location.href = 'https://app.neobeirut.com/admin' + (subPath ? '/' + subPath : '') + window.location.search + window.location.hash;
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
